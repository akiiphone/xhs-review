<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>小红书内容合规审核系统</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#f5f6fa;color:#1e293b;font-family:-apple-system,'PingFang SC','Microsoft YaHei','Helvetica Neue',sans-serif;min-height:100vh;line-height:1.6}
::selection{background:rgba(244,63,94,.15)}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-track{background:#f1f5f9}::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:3px}
input,select,textarea{font-family:inherit}
textarea:focus,input:focus,select:focus{outline:none;border-color:#f43f5e!important;box-shadow:0 0 0 3px rgba(244,63,94,.08)}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes spin{to{transform:rotate(360deg)}}
.fu{animation:fadeUp .4s ease-out forwards;opacity:0}

header{background:#fff;border-bottom:1px solid #e8ecf1;padding:16px 24px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.logo{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,#ff2442,#ff6280);display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:900;color:#fff;flex-shrink:0;box-shadow:0 2px 8px rgba(244,63,94,.25)}
.wrap{max-width:900px;margin:0 auto;padding:24px 20px 60px}
.card{background:#fff;border:1px solid #e8ecf1;border-radius:14px;padding:20px;margin-bottom:16px;box-shadow:0 1px 4px rgba(0,0,0,.03)}
.label{font-size:11px;color:#64748b;font-weight:600;letter-spacing:.5px;display:block;margin-bottom:5px}
.input{width:100%;padding:9px 12px;border-radius:8px;background:#f8f9fb;border:1.5px solid #e2e8f0;color:#1e293b;font-size:14px;transition:all .15s}
.textarea{width:100%;min-height:180px;padding:14px;border-radius:10px;background:#f8f9fb;border:1.5px solid #e2e8f0;color:#1e293b;font-size:14px;line-height:1.8;resize:vertical;transition:all .15s}
.btn{padding:9px 18px;border-radius:8px;border:none;font-size:13px;cursor:pointer;font-weight:600;transition:all .15s}
.btn:hover:not(:disabled){transform:translateY(-1px)}.btn:active:not(:disabled){transform:translateY(0)}
.btn-primary{background:linear-gradient(135deg,#ff2442,#ff6280);color:#fff;padding:9px 24px;box-shadow:0 2px 8px rgba(244,63,94,.25)}
.btn-ghost{border:1.5px solid #e2e8f0;background:#fff;color:#64748b}
.btn-ghost:hover{background:#f8f9fb}.btn-sec{background:#f1f5f9;color:#475569}
.btn:disabled{opacity:.5;cursor:not-allowed}

.tabs{display:flex;gap:4px;margin-bottom:16px;background:#eef0f4;border-radius:10px;padding:4px}
.tab{flex:1;padding:8px 0;border-radius:7px;border:none;font-size:12px;font-weight:600;cursor:pointer;background:transparent;color:#64748b;transition:all .15s}
.tab.active{background:#fff;color:#1e293b;box-shadow:0 1px 3px rgba(0,0,0,.06)}

.tag{padding:3px 10px;border-radius:6px;font-size:11px;font-weight:600;display:inline-flex;align-items:center;gap:3px}
.tag-red{background:#fef2f2;color:#dc2626;border:1px solid #fecaca}
.tag-yellow{background:#fffbeb;color:#92400e;border:1px solid #fde68a}
.tag-orange{background:#fff7ed;color:#9a3412;border:1px solid #fdba74}

.issue{padding:14px 16px;border-radius:10px;background:#fff;border:1px solid #e8ecf1;margin-bottom:8px;box-shadow:0 1px 2px rgba(0,0,0,.02)}
.issue-red{border-left:4px solid #dc2626}.issue-yellow{border-left:4px solid #d97706}.issue-orange{border-left:4px solid #ea580c}

mark.red{background:#fee2e2;color:#b91c1c;border-bottom:2px solid #dc2626;padding:1px 4px;border-radius:3px;font-weight:700}
mark.yellow{background:#fef3c7;color:#92400e;border-bottom:2px solid #d97706;padding:1px 4px;border-radius:3px;font-weight:700}
mark.orange{background:#ffedd5;color:#9a3412;border-bottom:2px solid #ea580c;padding:1px 4px;border-radius:3px;font-weight:700}

.sr{position:relative;width:130px;height:130px;flex-shrink:0}
.sr svg{width:130px;height:130px}
.sc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.sc .n{font-size:34px;font-weight:800;font-family:'Courier New',monospace}
.sc .s{font-size:10px;color:#94a3b8;letter-spacing:1px;margin-top:2px}
.wt{padding:2px 8px;border-radius:5px;font-size:10px;display:inline-block;margin:1.5px}
@media(max-width:640px){.wrap{padding:16px 12px 40px}.card{padding:16px}header{padding:12px 16px}.sr{width:100px;height:100px}.sr svg{width:100px;height:100px}.sc .n{font-size:26px}}
</style>
</head>
<body>
<header>
<div style="display:flex;align-items:center;gap:12px">

<div id="pRev"></div><div id="pHl" style="display:none"></div><div id="pDb" style="display:none"></div>
<div id="acts" style="display:none;display:flex;gap:8px;margin-top:16px;display:none"><button class="btn btn-ghost" onclick="clr()">🗑️ 清空</button><button class="btn btn-sec" onclick="doAI()">🔄 重新审核</button></div>
</div>

h+=`<div style="font-size:14px;line-height:2.4;white-space:pre-wrap;color:#334155">${hlT(c,scan(c))}</div>`;
if(g)h+=`<div style="margin-top:12px"><span style="font-size:11px;color:#94a3b8;margin-right:8px;font-weight:600">标签</span>${hlT(g,scan(g))}</div>`;h+='</div>';$('pHl').innerHTML=h}
function rDb(){let h='';for(const[lv,d]of Object.entries(D)){h+=`<div class="card" style="border-left:4px solid ${d.c}"><div style="display:flex;align-items:center;gap:8px;margin-bottom:8px"><span style="font-size:15px">${d.i}</span><span style="font-size:15px;font-weight:800;color:${d.c}">${d.l}</span><span style="font-size:11px;color:#94a3b8">— ${d.d}</span></div>`;for(const[cat,ws]of Object.entries(d.cats)){h+=`<div style="margin-top:10px"><div style="font-size:12px;color:#475569;font-weight:700;margin-bottom:5px">${cat} <span style="font-weight:400;color:#94a3b8">(${ws.length})</span></div><div style="display:flex;flex-wrap:wrap;gap:3px">`;for(const w of ws)h+=`<span class="wt" style="background:${d.bg};color:${d.c};border:1px solid ${d.bd}">${E(w)}</span>`;h+='</div></div>'}h+='</div>'}$('pDb').innerHTML=h}rDb();
function stab(n){document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.t===n));$('pRev').style.display=n==='rev'?'block':'none';$('pHl').style.display=n==='hl'?'block':'none';$('pDb').style.display=n==='db'?'block':'none'}
async function doAI(){const c=$('content').value.trim();if(!c){sE('请输入内容');return}hE();const b=$('br');b.disabled=true;b.textContent='审核中...';$('ld').style.display='block';$('pRev').innerHTML='';
const ms=doScan();const ind=$('industry').value,ti=$('title').value,tg=$('tags').value;
const ex=cS.m.length>0?'\n\n[扫描]'+cS.m.slice(0,25).map(m=>`[${m.l}]"${m.w}"(${m.cat})`).join(','):'\n\n[扫描]无敏感词，重点语义';
const sys=`你是资深小红书合规审核专家。2025最新规则。审核：A.关键词补充(变体/谐音) B.语义(软广/暗示导流/隐性承诺/标题党) C.行业合规(认证一致/资质/移民红线) D.调性 E.移民留学特审\n输出JSON：{"score":85,"level":"通过|需修改|高风险|禁止发布","summary":"","issues":[{"severity":"red|yellow|orange","category":"","content":"","reason":"","suggestion":"","rule_ref":""}],"highlights":[],"tone_check":"","rewrite_suggestions":""}\n90-100可发布 75-89小改 50-74大改 25-49高风险 0-24禁止`;
try{const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:4000,system:sys,messages:[{role:'user',content:`[行业]${ind}\n[标题]${ti||'无'}\n[正文]\n${c}\n[标签]${tg||'无'}${ex}\n\nJSON。`}]})});if(!r.ok)throw new Error(''+r.status);const d=await r.json();const t=d.content.filter(b=>b.type==='text').map(b=>b.text).join('');cR=JSON.parse(t.replace(/```json\s*/g,'').replace(/```\s*/g,'').trim());rRes();stab('rev')}
catch(e){if(cS.m.length>0){cR=gL();rRes();stab('rev');sE('AI不可用，已用本地词库审核')}else sE('AI失败:'+e.message)}
finally{b.disabled=false;b.textContent='🤖 AI 全面审核';$('ld').style.display='none';$('tb').style.display='flex';$('acts').style.display='flex'}}
function gL(){let s=100;s-=cS.r*20;s-=cS.y*8;s-=cS.o*3;s=Math.max(0,Math.min(100,s));let l='通过';if(s<25)l='禁止发布';else if(s<50)l='高风险';else if(s<75)l='需修改';return{score:s,level:l,summary:`${cS.r}个禁词 · ${cS.y}个敏感词 · ${cS.o}个风险词`,issues:cS.m.map(x=>({severity:x.lv,category:x.cat,content:x.w,reason:`「${x.w}」→「${x.cat}」(${D[x.lv].l})`,suggestion:`删除或替换「${x.w}」`,rule_ref:'本地词库'})),highlights:[],tone_check:'本地模式',rewrite_suggestions:cS.r>0?'必须删除红色禁词':'修改黄色/橙色词汇降低风险'}}
function rRes(){const r=cR;if(!r)return;const sc=r.score>=90?'#059669':r.score>=75?'#65a30d':r.score>=50?'#d97706':r.score>=25?'#dc2626':'#7f1d1d';const rd=50,ci=2*Math.PI*rd,of=ci-(r.score/100)*ci;const lc={'通过':'#059669','需修改':'#d97706','高风险':'#dc2626','禁止发布':'#7f1d1d'};const li={'通过':'✅','需修改':'⚠️','高风险':'❌','禁止发布':'⛔'};
let h='<div class="fu"><div class="card" style="display:flex;gap:20px;align-items:center;flex-wrap:wrap;padding:24px"><div class="sr"><svg viewBox="0 0 130 130"><circle cx="65" cy="65" r="'+rd+'" fill="none" stroke="#f1f5f9" stroke-width="8"/><circle cx="65" cy="65" r="'+rd+'" fill="none" stroke="'+sc+'" stroke-width="8" stroke-dasharray="'+ci+'" stroke-dashoffset="'+of+'" stroke-linecap="round" transform="rotate(-90 65 65)" style="transition:all 1s"/></svg><div class="sc"><span class="n" style="color:'+sc+'">'+r.score+'</span><span class="s">合规评分</span></div></div><div style="flex:1;min-width:220px"><div style="margin-bottom:8px"><span style="padding:4px 14px;border-radius:20px;font-size:13px;font-weight:700;background:'+(lc[r.level]||'#d97706')+'12;color:'+(lc[r.level]||'#d97706')+'">'+(li[r.level]||'⚠️')+' '+r.level+'</span></div><p style="font-size:15px;color:#334155;line-height:1.7">'+E(r.summary)+'</p>';
if(r.tone_check)h+='<p style="font-size:12px;color:#94a3b8;margin-top:6px">📝 '+E(r.tone_check)+'</p>';
if(r.rewrite_suggestions&&r.level!=='通过')h+='<div style="margin-top:10px;padding:10px 14px;border-radius:8px;background:#eff6ff;border-left:3px solid #3b82f6;font-size:12px;color:#1d4ed8;line-height:1.6"><strong>修改方向：</strong>'+E(r.rewrite_suggestions)+'</div>';
h+='</div></div>';
if(cS&&cS.m.length>0){h+='<div class="card"><div style="font-size:12px;color:#64748b;font-weight:700;margin-bottom:10px">🔍 关键词扫描</div><div style="display:flex;flex-wrap:wrap;gap:5px">';for(const m of cS.m)h+='<span class="tag tag-'+m.lv+'">'+m.ic+' '+E(m.w)+' <span style="opacity:.6;font-weight:400;font-size:9px">'+m.cat+'</span></span>';h+='</div></div>'}
if(r.issues&&r.issues.length>0){h+='<div style="margin-bottom:14px"><div style="font-size:12px;color:#64748b;font-weight:700;margin-bottom:10px">🚨 问题 ('+r.issues.length+')</div>';r.issues.forEach((is,i)=>{const s=D[is.severity]||D.orange;h+='<div class="issue issue-'+is.severity+' fu" style="animation-delay:'+i*.06+'s"><div style="display:flex;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap"><span class="tag tag-'+is.severity+'">'+s.i+' '+s.l+'</span><span style="font-size:11px;color:#64748b">'+E(is.category)+'</span>'+(is.rule_ref?'<span style="font-size:10px;color:#94a3b8;margin-left:auto">'+E(is.rule_ref)+'</span>':'')+'</div>'+(is.content?'<div style="padding:6px 10px;border-radius:6px;margin-bottom:6px;background:#f8f9fb;font-size:12px;color:#475569;border-left:3px solid #e2e8f0">"'+E(is.content)+'"</div>':'')+'<p style="font-size:12px;color:#64748b;line-height:1.6">'+E(is.reason)+'</p>'+(is.suggestion?'<p style="font-size:12px;color:#0d9488;line-height:1.6;margin-top:4px">💡 '+E(is.suggestion)+'</p>':'')+'</div>'});h+='</div>'}
if(r.highlights&&r.highlights.length>0){h+='<div class="card" style="background:#ecfdf5;border-color:#a7f3d0"><div style="font-size:12px;color:#059669;font-weight:700;margin-bottom:8px">✨ 亮点</div>';r.highlights.forEach(x=>h+='<p style="font-size:12px;color:#047857;line-height:1.7">· '+E(x)+'</p>');h+='</div>'}
h+='</div>';$('pRev').innerHTML=h}
function sE(m){$('err').textContent=m;$('err').style.display='block'}function hE(){$('err').style.display='none'}
function clr(){['content','title','tags'].forEach(id=>$(id).value='');$('cc').textContent='0 字';$('sb').innerHTML='';['tb','acts'].forEach(id=>$(id).style.display='none');['pRev','pHl','pDb'].forEach(id=>{$(id).innerHTML='';$(id).style.display='none'});cS=null;cR=null;hE()}
</script>
</body>
